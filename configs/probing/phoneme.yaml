# Phoneme classification probing on LibriSpeech + MFA
property_name: phoneme
num_classes: 39           # Standard 39-phone set
level: frame

model_name: wavlm_large
features_dir: features/wavlm_large
layers: null

probe:
  probe_type: linear
  hidden_dim: 256
  dropout: 0.1

training:
  learning_rate: 0.001
  batch_size: 1024
  max_epochs: 20
  patience: 5
  seed: 42

pooling: null             # Not applicable for frame-level
results_dir: results/probing
