# Speaker identity probing on LibriSpeech
property_name: speaker
num_classes: 251          # LibriSpeech train-clean-100 has 251 speakers
level: utterance

model_name: wavlm_large
features_dir: features/wavlm_large
layers: null              # null = probe ALL layers

probe:
  probe_type: linear
  hidden_dim: 256
  dropout: 0.1

training:
  learning_rate: 0.001
  batch_size: 256
  max_epochs: 50
  patience: 5
  seed: 42

pooling: mean
results_dir: results/probing
