model:
  name: whisper_large_v3
  hub_id: openai/whisper-large-v3
  num_layers: 32
  hidden_dim: 1280
  use_fp16: true

data:
  dataset_name: librispeech
  data_dir: data/raw/librispeech
  sample_rate: 16000
  max_duration: 10.0
  min_duration: 1.0

extraction:
  output_dir: features/whisper_large_v3
  batch_size: 2
  num_workers: 4
