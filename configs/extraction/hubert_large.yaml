model:
  name: hubert_large
  hub_id: facebook/hubert-large-ll60k
  num_layers: 24
  hidden_dim: 1024
  use_fp16: true

data:
  dataset_name: librispeech
  data_dir: data/raw/librispeech
  sample_rate: 16000
  max_duration: 10.0
  min_duration: 1.0

extraction:
  output_dir: features/hubert_large
  batch_size: 4
  num_workers: 4
