[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-representations"
version = "1.0.0"
description = "Reproducible layer-wise analysis of speech foundation model representations"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fatemeh Khaki" }]
keywords = ["speech", "representation learning", "probing", "CKA", "PyTorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "h5py>=3.11,<4",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "praat-parselmouth>=0.4.5,<1",
  "PyYAML>=6.0.2,<7",
  "scikit-learn>=1.5,<2",
  "soundfile>=0.12.1,<1",
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "tqdm>=4.66,<5",
  "transformers>=4.46,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
speech-repr = "speech_representations.cli:main"

[project.urls]
Repository = "https://github.com/Fatemehkhakii94/speech-representations"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["speech_representations*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
testpaths = ["tests"]
markers = [
  "integration: tests that require model downloads or external datasets",
  "gpu: tests that require a CUDA-capable GPU",
]

[tool.coverage.run]
branch = true
source = ["speech_representations"]
omit = [
  "*/__main__.py",
  "*/analysis/downstream.py",
  "*/analysis/plots.py",
  "*/cli.py",
  "*/data/datasets.py",
  "*/features/extractor.py",
  "*/probing/experiment.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "h5py.*",
  "parselmouth.*",
  "sklearn.*",
  "torchaudio.*",
  "tqdm.*",
  "yaml.*",
]
ignore_missing_imports = true

