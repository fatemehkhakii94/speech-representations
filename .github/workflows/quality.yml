name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src/speech_representations
      - name: Unit tests
        run: pytest -m "not integration and not gpu" --cov=speech_representations --cov-report=term-missing
